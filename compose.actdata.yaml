# Model sources for the "Load model" panel (VNN-LIB benchmarks, ONNX classifiers, MNIST/CIFAR-10 test sets).
# These ACT directories are git-ignored, so the image does not contain them; mount them read-only:
#   docker compose -f compose.yaml -f compose.actdata.yaml up -d        (add -f compose.gpu.yaml for GPUs)
# ACT_DATA_FROM defaults to $ACT_ROOT or /data1/guanqin/ACT.
services:
  workbench:
    volumes:
      - ${ACT_DATA_FROM:-${ACT_ROOT:-/data1/guanqin/ACT}}/data:/opt/act/data:ro
      - ${ACT_DATA_FROM:-${ACT_ROOT:-/data1/guanqin/ACT}}/literature:/opt/act/literature:ro
