# Overlay: mount your own Gurobi license file read-only. Set GUROBI_LICENSE_FILE in .env.
# The file must be readable by the container user (uid 10001). A license uploaded through
# the Engine tab takes precedence over this one.
services:
  workbench:
    environment:
      GRB_LICENSE_FILE: /run/secrets/gurobi.lic
    secrets:
      - gurobi.lic

secrets:
  gurobi.lic:
    file: ${GUROBI_LICENSE_FILE:?set GUROBI_LICENSE_FILE to the path of your gurobi.lic}
