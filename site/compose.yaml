# ACT-GUI website (static). Start:   docker compose -f site/compose.yaml up -d --build
# -> http://127.0.0.1:${ACT_SITE_PORT:-18081}. Independent of the workbench project in ../compose.yaml.
name: act-gui-site

services:
  site:
    image: act-gui-site:0.1.0
    build:
      context: ..  # the repository root (see Dockerfile)
      dockerfile: site/Dockerfile
    ports:
      - "127.0.0.1:${ACT_SITE_PORT:-18081}:80"
    restart: unless-stopped
