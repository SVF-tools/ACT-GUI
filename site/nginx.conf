server {
    listen 80;
    root /usr/share/nginx/html;
    # Behind the tunnel, keep redirects relative so they stay on https://act-online.au.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # VitePress clean URLs: /guide/modes is served from guide/modes.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Developer docs exist only in English, in each module's directory. The language switcher on a
    # developer page links to its /zh/ or /fr/ path; send it to the English page instead of a 404.
    location ~ ^/(?:zh|fr)/((?:README|AGENTS)(?:\.html)?|(?:docs|visual_bench|engine_bridge|site)/.*)$ {
        return 302 /$1$is_args$args;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
